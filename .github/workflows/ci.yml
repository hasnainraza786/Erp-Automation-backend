name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0000
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-000
      SEED_ADMIN_EMAIL: admin@erp.local
      SEED_ADMIN_PASSWORD: Admin@12345
      SCHEDULER_ENABLED: "false"
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test
      - run: yarn prisma migrate deploy
      - run: node dist/cli/seed.js --demo
      - name: Start API
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && break; sleep 1; done
      - run: API_URL=http://localhost:4000 yarn test:e2e
      - name: Export OpenAPI spec
        run: node dist/cli/export-openapi.js openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
      - if: failure()
        run: cat api.log

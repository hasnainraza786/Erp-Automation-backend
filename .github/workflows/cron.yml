# Free hosts sleep when idle, so an external cron wakes the API hourly to run
# notifications, quotation expiry, cleanup and the nightly JSON snapshot backup.
#
# Repo secrets:
#   API_URL      public origin, e.g. https://erp-api.onrender.com
#   CRON_SECRET  same value as the Render CRON_SECRET env var
name: Scheduled jobs

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger jobs
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Set repository secrets API_URL and CRON_SECRET (see DEPLOY.md)."
            exit 1
          fi
          curl -sf --retry 8 --retry-delay 20 --retry-all-errors --max-time 180 \
            -X POST "$API_URL/api/v1/system/jobs" \
            -H "X-Cron-Secret: $CRON_SECRET"

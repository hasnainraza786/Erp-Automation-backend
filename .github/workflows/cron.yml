# Free hosts sleep when idle, so an external cron wakes the API hourly to run
# notifications, quotation expiry, cleanup and the nightly backup.
name: Scheduled jobs

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger jobs
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf --retry 5 --retry-delay 20 --max-time 120 -X POST "$API_URL/api/v1/system/jobs" -H "X-Cron-Secret: $CRON_SECRET"

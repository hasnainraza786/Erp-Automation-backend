# Render Blueprint (free web service). Database: Neon Postgres. Files: Cloudflare R2.
# Apply from the Render dashboard: New → Blueprint → this repo.
services:
  - type: web
    name: erp-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled URI + ?sslmode=require&pgbouncer=true&connection_limit=5
      - key: DIRECT_URL
        sync: false # Neon unpooled (direct) URI + ?sslmode=require — required for prisma migrate
      - key: CORS_ORIGINS
        sync: false # e.g. https://erp-web.pages.dev,https://erp.yourcompany.com
      - key: PUBLIC_API_URL
        sync: false # public origin of this API, e.g. https://erp-api.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "30"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: erp-files
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false # used only when the admin user does not exist yet
      - key: CRON_SECRET
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: BACKUP_RETENTION
        value: "14"
